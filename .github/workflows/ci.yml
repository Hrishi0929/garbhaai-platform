name: CI

on: [pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ui, ingestion, quality-check, preprocessing, feature-extraction, inference]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: pip install -r services/${{ matrix.service }}/requirements.txt flake8 pytest
      - name: Lint
        run: flake8 services/${{ matrix.service }}
      - name: Test
        run: pytest services/${{ matrix.service }}/tests
      - name: Build image
        run: docker build -t ${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}
      - name: Push to GHCR (on merge to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag ${{ matrix.service }}:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
