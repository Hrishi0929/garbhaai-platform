name: CI

# Originally pull_request-only (the runbook's L3 spec) -- but every commit
# on this project has gone straight to main via `git push`, never through
# a PR, so this workflow had never once fired (confirmed: an empty Actions
# tab, and a test (test_health, see services/inference/tests/test_main.py)
# that had been silently broken since Phase 7 because nothing was ever
# running it). Adding push-to-main so it actually runs on the workflow
# this project really uses, without giving up pull_request coverage for
# if/when PRs start being used.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [
            ui,
            ingestion,
            quality-check,
            preprocessing,
            feature-extraction,
            inference,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
        run: pip install -r services/${{ matrix.service }}/requirements.txt flake8 pytest
      - name: Lint
        run: flake8 services/${{ matrix.service }}
      - name: Test
        run: pytest services/${{ matrix.service }}/tests
      - name: Build image
        run: docker build -t ${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}
      - name: Push to GHCR (on merge to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag ${{ matrix.service }}:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}

  training-eval-engine:
    # training_engine/train.py and eval_engine/evaluate.py aren't deployed
    # services (no Dockerfile, no matrix entry) -- they're run manually per
    # the Phase 6 runbook, since they need the live MLflow server and
    # feature-extraction service, which this CI job doesn't stand up. But
    # eval_engine's own unit tests (checkpoint structure / metric
    # completeness validation) are pure and network-free, so there's no
    # reason not to run those here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
        run: |
          pip install -r training/eval_engine/requirements.txt flake8 pytest
      - name: Lint
        run: flake8 training/training_engine training/eval_engine
      - name: Test eval_engine
        run: pytest training/eval_engine/tests
