name: CI

# Originally pull_request-only (the runbook's L3 spec) -- but every commit
# on this project has gone straight to main via `git push`, never through
# a PR, so this workflow had never once fired. Adding push-to-main so it
# actually runs on the workflow this project really uses, without giving up
# pull_request coverage for if/when PRs start being used.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ingestion, quality-check, preprocessing, feature-extraction, inference]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: pip install -r services/${{ matrix.service }}/requirements.txt flake8 pytest
      - name: Lint
        run: flake8 services/${{ matrix.service }}
      - name: Test
        run: pytest services/${{ matrix.service }}/tests
      - name: Build image
        run: docker build -t ${{ matrix.service }}:${{ github.sha }} services/${{ matrix.service }}
      - name: Push to GHCR (on merge to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag ${{ matrix.service }}:${{ github.sha }} ghcr.io/${OWNER}/${{ matrix.service }}:${{ github.sha }}
          docker push ghcr.io/${OWNER}/${{ matrix.service }}:${{ github.sha }}

  ui-next:
    # Next.js UI (replaces the old Streamlit `ui` service).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ui-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/ui-next/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Build image
        run: docker build -t ui-next:${{ github.sha }} .
      - name: Push to GHCR (on merge to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag ui-next:${{ github.sha }} ghcr.io/${OWNER}/ui-next:${{ github.sha }}
          docker push ghcr.io/${OWNER}/ui-next:${{ github.sha }}

  training-eval-engine:
    # training_engine/train.py and eval_engine/evaluate.py aren't deployed
    # services (no Dockerfile, no matrix entry) -- they're run manually per
    # the Phase 6 runbook, since they need the live MLflow server and
    # feature-extraction service, which this CI job doesn't stand up. But
    # eval_engine's own unit tests are pure and network-free, so they run here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: |
          pip install -r training/eval_engine/requirements.txt flake8 pytest
      - name: Lint
        run: flake8 training/training_engine training/eval_engine
      - name: Test eval_engine
        run: pytest training/eval_engine/tests
