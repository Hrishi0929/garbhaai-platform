# Phase 4/5 application services, wired together for local end-to-end testing.
#
# Assumes the Phase 2 data plane (infra/local/docker-compose.yml) is already
# running -- ingestion and inference reach its Postgres (and, for ingestion,
# RustFS) over host.docker.internal (Docker Desktop's bridge back to the
# host), since those containers live in a separate compose project/network,
# published on the host ports set up in Phase 2 (5432, 9000).
#
# Usage:
#   cd infra/local && ./bootstrap.sh          # Phase 2 data plane, if not already up
#   cd ../../services && docker compose up --build
#   open http://localhost:8511                # the UI
services:
  quality-check:
    build: ./quality-check
    ports:
      - "8002:8000"
    environment:
      # Phase 9 gap-closure: logs every check's {ok, warnings} to the
      # quality_checks table, keyed by the same image_hash convention
      # ingestion/inference use -- see main.py's module docstring.
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: "5432"
      POSTGRES_DB: garbhaai
      POSTGRES_USER: garbhaai
      POSTGRES_PASSWORD: garbhaai_local_dev

  preprocessing:
    build: ./preprocessing
    ports:
      - "8003:8000"

  feature-extraction:
    build: ./feature-extraction
    ports:
      - "8004:8000"

  ingestion:
    build: ./ingestion
    ports:
      - "8001:8000"
    environment:
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: "5432"
      POSTGRES_DB: garbhaai
      POSTGRES_USER: garbhaai
      POSTGRES_PASSWORD: garbhaai_local_dev
      RUSTFS_ENDPOINT: http://host.docker.internal:9000
      RUSTFS_ACCESS_KEY: garbhaai
      RUSTFS_SECRET_KEY: garbhaai_local_dev
      RUSTFS_BUCKET: garbhaai-images

  inference:
    build: ./inference
    ports:
      - "8005:8000"
    environment:
      FEATURE_EXTRACTION_URL: http://feature-extraction:8000
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: "5432"
      POSTGRES_DB: garbhaai
      POSTGRES_USER: garbhaai
      POSTGRES_PASSWORD: garbhaai_local_dev
    depends_on:
      - feature-extraction

  ui:
    build: ./ui
    ports:
      - "8511:8501"  # host 8501 is commonly taken by another local Streamlit
                     # app (e.g. the old garbhaai-embryo-grading app) -- this
                     # avoids the collision rather than requiring you to
                     # close that other process.
    environment:
      INGESTION_URL: http://ingestion:8000
      QUALITY_CHECK_URL: http://quality-check:8000
      INFERENCE_URL: http://inference:8000
    depends_on:
      - ingestion
      - quality-check
      - inference
