[pytest]
# Without this, pytest's default "prepend" import mode inserts only the
# test file's own directory (tests/) onto sys.path -- not this directory,
# which is where main.py (or evaluate.py, for eval_engine) actually lives.
# Every test file here does `from main import ...` expecting this
# directory to already be importable, which silently only ever worked
# when someone happened to run pytest with a different cwd/PYTHONPATH
# than CI uses -- CI invokes `pytest services/<name>/tests` from the repo
# root, which hits the real bug directly: ModuleNotFoundError: No module
# named 'main'. `pythonpath = .` makes pytest add this ini file's own
# directory to sys.path before collecting tests, regardless of invocation
# style or cwd. Requires pytest>=7.0 (this project's CI installs
# unpinned, currently resolving 9.x) -- see the bare `pytest` entry in
# each service's own requirements.txt/CI step.
pythonpath = .
