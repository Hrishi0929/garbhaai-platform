# Phase 2 -- local data plane for GarbhaAI
# Mirrors, at zero cost, what the paid stack would give us:
#   postgres -> Cloud SQL (metadata: image records, grades, audit log)
#   rustfs   -> Cloud Storage (raw + processed embryo images, model artifacts)
#              S3-compatible object store. We use RustFS instead of MinIO
#              because MinIO discontinued free public Docker images in
#              Oct 2025; RustFS is an actively-maintained, openly
#              distributed drop-in replacement with the same S3 API.
#   redis    -> Memorystore (Feast online feature store + app caching)
#   mlflow   -> Vertex AI Experiments / a managed MLflow service (Phase 6:
#              experiment tracking + model registry). Backed by the same
#              postgres (backend store) and rustfs (artifact store, under
#              the mlflow-artifacts/ prefix of the existing bucket) --
#              zero extra infra for a local-dev tracking server.
#
# Usage:
#   cd infra/local
#   docker compose up -d
#   docker compose ps        # check health
#   docker compose down      # stop (data persists in ./.volumes)
#   docker compose down -v   # stop AND wipe volumes

services:
  postgres:
    image: postgres:16-alpine
    container_name: garbhaai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: garbhaai
      POSTGRES_PASSWORD: garbhaai_local_dev
      POSTGRES_DB: garbhaai
    ports:
      - "5432:5432"
    volumes:
      - ./.volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garbhaai -d garbhaai"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs_perms:
    image: alpine:latest
    container_name: garbhaai-rustfs-perms
    user: root
    volumes:
      - ./.volumes/rustfs:/fix_path
    command: chown -R 10001:10001 /fix_path

  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: garbhaai-rustfs
    restart: unless-stopped
    depends_on:
      rustfs_perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: garbhaai
      RUSTFS_SECRET_KEY: garbhaai_local_dev
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"   # S3-compatible API
      - "9001:9001"   # web console
    volumes:
      - ./.volumes/rustfs/data:/data
      - ./.volumes/rustfs/logs:/var/log/rustfs/
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: garbhaai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./.volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    build: ./mlflow
    container_name: garbhaai-mlflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: garbhaai
      AWS_SECRET_ACCESS_KEY: garbhaai_local_dev
      MLFLOW_S3_ENDPOINT_URL: http://rustfs:9000
    ports:
      - "5500:5000"
    command: >
      mlflow server
      --backend-store-uri postgresql://garbhaai:garbhaai_local_dev@postgres:5432/garbhaai
      --default-artifact-root s3://garbhaai-images/mlflow-artifacts
      --host 0.0.0.0
      --port 5000
      --serve-artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
